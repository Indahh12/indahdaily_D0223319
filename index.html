<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daily Activity Tracker</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff7cc, #ffeaa7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fffdf5;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }

        h2 {
            color: #d4a017;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 12px;
            border: 1px solid #f5d97a;
            transition: 0.3s;
        }

        input:focus {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #f4c430;
            color: #5a4500;
            font-weight: bold;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        /* Ripple effect */
        button::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            transform: scale(1);
            opacity: 0;
        }

        button:active::after {
            animation: ripple 0.5s ease;
        }

        @keyframes ripple {
            from {
                transform: scale(1);
                opacity: 1;
            }
            to {
                transform: scale(20);
                opacity: 0;
            }
        }

        #total {
            margin-top: 15px;
            font-weight: bold;
            color: #8a6d00;
        }

        li {
            background: #fff3b0;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 5px solid #f4c430;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5) translateY(20px);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        li:hover {
            transform: scale(1.05) rotate(-1deg);
            transition: 0.2s;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🌼 Daily Activity Tracker 🌼</h2>

    <input type="text" id="aktivitas" placeholder="contoh: belajar">
    <input type="number" id="durasi" placeholder="Durasi (menit)">
    <button id="tambah">Tambah</button>

    <p id="total">Total: 0 menit (0 aktivitas)</p>

    <ol id="list"></ol>
</div>

<script>
    const inputAktivitas = document.getElementById("aktivitas");
    const inputDurasi = document.getElementById("durasi");
    const btnTambah = document.getElementById("tambah");
    const list = document.getElementById("list");
    const totalText = document.getElementById("total");

    let totalMenit = 0;
    let jumlahAktivitas = 0;

    btnTambah.addEventListener("click", function () {
        const aktivitas = inputAktivitas.value;
        const durasi = parseInt(inputDurasi.value);

        if (aktivitas === "" || isNaN(durasi)) {
            alert("Isi aktivitas dan durasi dengan benar!");
            return;
        }

        const li = document.createElement("li");
        li.textContent = aktivitas + " — " + durasi + " menit";

        list.appendChild(li);

        totalMenit += durasi;
        jumlahAktivitas++;

        totalText.textContent = 
            "Total: " + totalMenit + " menit (" + jumlahAktivitas + " aktivitas)";

        inputAktivitas.value = "";
        inputDurasi.value = "";
    });
</script>

</body>
</html>
